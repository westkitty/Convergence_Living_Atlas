name: Publish site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: "pages-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync site files and assets to gh-pages
        id: sync
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages

          # The deployed branch must contain the exact production site tree.
          git rm -r --ignore-unmatch assets
          git checkout "$GITHUB_SHA" -- index.html .nojekyll assets

          git add index.html .nojekyll assets

          if ! git diff --cached --quiet; then
            git commit -m "Deploy ${GITHUB_SHA::7}"
            git push origin gh-pages
          else
            echo "gh-pages already matches main site files and assets."
          fi

          git fetch origin gh-pages
          PAGES_SHA="$(git rev-parse origin/gh-pages)"
          echo "pages_sha=$PAGES_SHA" >> "$GITHUB_OUTPUT"
          echo "gh-pages source revision: $PAGES_SHA"

      - name: Request actual GitHub Pages rebuild
        id: pages_build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.sync.outputs.pages_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting Pages rebuild for configured publishing source..."
          gh api             --method POST             -H "Accept: application/vnd.github+json"             "repos/$GITHUB_REPOSITORY/pages/builds"             >/tmp/pages-build-request.json

          cat /tmp/pages-build-request.json

          status=""
          commit=""
          for attempt in $(seq 1 60); do
            status="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.status')"
            commit="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '.commit')"
            echo "Pages build attempt $attempt: status=$status commit=$commit expected=$EXPECTED_SHA"

            if [[ "$status" == "built" && "$commit" == "$EXPECTED_SHA" ]]; then
              echo "GitHub Pages built the current gh-pages revision."
              exit 0
            fi

            if [[ "$status" == "errored" ]]; then
              gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest"
              exit 1
            fi

            sleep 2
          done

          echo "Pages build did not reach built state for $EXPECTED_SHA." >&2
          gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" || true
          exit 1

      - name: Verify live Pages bytes and assets
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://westkitty.github.io/Convergence_Living_Atlas"
          LIVE_INDEX="/tmp/convergence-live-index.html"
          LIVE_COVER="/tmp/convergence-live-covers.webp"
          LIVE_HERO="/tmp/convergence-live-hero.webp"
          LIVE_ATLAS="/tmp/convergence-live-atlas-bg.webp"

          matched=0
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 "$BASE/" -o "$LIVE_INDEX"               && curl -fsS --max-time 10 "$BASE/assets/covers.webp" -o "$LIVE_COVER" \
              && curl -fsS --max-time 10 "$BASE/assets/generated/hero.webp" -o "$LIVE_HERO" \
              && curl -fsS --max-time 10 "$BASE/assets/generated/atlas-bg.webp" -o "$LIVE_ATLAS" \
              && cmp -s index.html "$LIVE_INDEX" \
              && cmp -s assets/covers.webp "$LIVE_COVER" \
              && cmp -s assets/generated/hero.webp "$LIVE_HERO" \
              && cmp -s assets/generated/atlas-bg.webp "$LIVE_ATLAS"; then
              matched=1
              echo "Live Pages matches production HTML and cover asset on attempt $attempt."
              break
            fi

            echo "Waiting for Pages/CDN propagation (attempt $attempt/60)..."
            sleep 2
          done

          if [[ "$matched" -ne 1 ]]; then
            echo "Live Pages is still serving stale or incomplete bytes." >&2
            printf 'expected index sha256: '
            sha256sum index.html | cut -d' ' -f1
            printf 'live index sha256: '
            sha256sum "$LIVE_INDEX" 2>/dev/null | cut -d' ' -f1 || true
            printf 'expected cover sha256: '
            sha256sum assets/covers.webp | cut -d' ' -f1
            printf 'live cover sha256: '
            sha256sum "$LIVE_COVER" 2>/dev/null | cut -d' ' -f1 || true
            exit 1
          fi

          grep -q 'data-route="overview"' "$LIVE_INDEX"
          grep -q 'id="scopeBtn"' "$LIVE_INDEX"
          grep -q 'assets/covers.webp' "$LIVE_INDEX"
          test -s "$LIVE_COVER"
          test -s "$LIVE_HERO"
          test -s "$LIVE_ATLAS"
          grep -q 'assets/generated/hero.webp' "$LIVE_INDEX"
          grep -q 'assets/generated/atlas-bg.webp' "$LIVE_INDEX"

          echo "LIVE PAGES GDRIVE ASSET VERIFY PASS"
