name: Publish site to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-publish"
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync site files and assets to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages

          # The deployed branch must contain the exact production asset tree
          # from the source revision. Remove stale deployed assets first.
          git rm -r --ignore-unmatch assets
          git checkout "$GITHUB_SHA" -- index.html .nojekyll assets

          git add index.html .nojekyll assets

          if ! git diff --cached --quiet; then
            git commit -m "Deploy ${GITHUB_SHA::7}"
            git push origin gh-pages
          else
            echo "gh-pages already matches main site files and assets."
          fi

      - name: Verify gh-pages branch bytes
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin gh-pages

          git show origin/gh-pages:index.html > /tmp/gh-pages-index.html
          git show origin/gh-pages:assets/covers.webp > /tmp/gh-pages-covers.webp

          cmp -s index.html /tmp/gh-pages-index.html
          cmp -s assets/covers.webp /tmp/gh-pages-covers.webp

          grep -q '<title>Convergence: Living Atlas</title>' /tmp/gh-pages-index.html
          test -s /tmp/gh-pages-covers.webp

          echo "GH-PAGES BRANCH VERIFY PASS"
          printf 'index sha: '
          git rev-parse origin/gh-pages:index.html
          printf 'cover sha: '
          git rev-parse origin/gh-pages:assets/covers.webp
