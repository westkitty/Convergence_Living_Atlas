// Normalize source metadata inherited from the supplied editions.
BOOKS[0].pages=482;BOOKS[1].pages=521;BOOKS[2].pages=506;BOOKS[3].pages=456;BOOKS[4].pages=429;BOOKS[5].pages=459;

const ALL_ENTITIES=[...CHARACTERS,...GROUPS];
const ENTITY=new Map(ALL_ENTITIES.map(x=>[x.id,x]));
const byId=id=>ENTITY.get(id)||null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const bookNum=v=>{const m=String(v||'').match(/B(\d)/);return m?+m[1]:1};
const bookLabel=n=>{const b=BOOKS.find(x=>x.n===+n);return b?`Book ${b.n} · ${b.title}`:`Book ${n}`};
const entityName=id=>byId(id)?.name||id;
const entityColor=id=>byId(id)?.color||'#8795aa';
const statusLabel=s=>String(s||'UNKNOWN').replaceAll('_',' ').toUpperCase();
const confidenceLabel=c=>({high:'CONFIRMED',reported:'REPORTED',uncertain:'UNKNOWN / THEORY',perspective:'PERSPECTIVE',inferred:'INFERRED'}[c]||String(c||'UNKNOWN').toUpperCase());
const bookColor=n=>BOOKS.find(x=>x.n===+n)?.color||'#8290a6';
const withinScope=v=>bookNum(v)<=STATE.scopeBook;
const coverPos=n=>`${(Math.max(1,Math.min(6,+n))-1)*20}%`;

const DEFAULTS={pins:[],bookmarks:[],history:[],motion:'full',performance:'balanced',labels:true,introSkipped:false,introSeen:false,timelineBook:6,scopeBook:6,focus:'full',perfHud:false};
function loadState(){try{return {...DEFAULTS,...JSON.parse(localStorage.getItem('convergenceAtlasState')||'{}')}}catch{return {...DEFAULTS}}}
let STATE=loadState();
if(matchMedia('(prefers-reduced-motion: reduce)').matches&&!localStorage.getItem('convergenceAtlasMotionExplicit'))STATE.motion='reduced';
let viewCleanup=()=>{};

function saveState(){localStorage.setItem('convergenceAtlasState',JSON.stringify(STATE))}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1800)}
function setMotionClass(){document.body.classList.toggle('reduce-motion',STATE.motion!=='full');}

function routeTo(path){if(!path.startsWith('#'))path='#'+path;if(location.hash===path){renderRoute()}else location.hash=path}
function parseRoute(){const raw=(location.hash||'#overview').slice(1);const p=raw.split('/').filter(Boolean);return {name:p[0]||'overview',a:p[1],b:p[2]}}
function rememberHistory(label,hash){STATE.history=[{label,hash},...STATE.history.filter(x=>x.hash!==hash)].slice(0,8);saveState()}
function bookmarkKey(type,id){return `${type}:${id}`}
function isBookmarked(type,id){return STATE.bookmarks.some(x=>x.key===bookmarkKey(type,id))}
function toggleBookmark(type,id,label,hash){const key=bookmarkKey(type,id);if(isBookmarked(type,id)){STATE.bookmarks=STATE.bookmarks.filter(x=>x.key!==key);toast('Bookmark removed')}else{STATE.bookmarks=[{key,type,id,label,hash},...STATE.bookmarks].slice(0,40);toast('Bookmarked')}saveState()}
function bookmarkButton(type,id,label,hash){return `<button class=\"ghost-btn\" data-bookmark-type=\"${esc(type)}\" data-bookmark-id=\"${esc(id)}\" data-bookmark-label=\"${esc(label)}\" data-bookmark-hash=\"${esc(hash)}\">${isBookmarked(type,id)?'★ Bookmarked':'☆ Bookmark'}</button>`}
function updateNav(name){document.querySelectorAll('[data-route]').forEach(el=>el.classList.toggle('active',el.dataset.route===name));document.querySelectorAll('.mobile-nav button').forEach(el=>el.classList.toggle('active',el.dataset.route===name));document.getElementById('crumb').textContent=name==='relationships'?'Relationships':name[0]?.toUpperCase()+name.slice(1)}
function cleanup(){try{viewCleanup()}catch{} viewCleanup=()=>{};graphApi=null;clearInterval(storyTimer);storyTimer=null;}

function pageHead(kicker,title,desc,actions=''){return `<div class="page-head"><div class="eyebrow">${esc(kicker)}</div><h2>${esc(title)}</h2><p>${esc(desc)}</p>${actions}</div>`}
function pills(items=[]){return `<div class="meta">${items.filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>`}
function entityPill(id){const e=byId(id);if(!e)return '';if(e.role&&!withinScope(e.first))return '';return `<span class="pill" style="color:${e.color}"><span class="dot"></span>${esc(e.name)}</span>`}
function relationFor(a,b){return RELATIONSHIPS.find(r=>withinScope(r.first)&&((r.source===a&&r.target===b)||(r.direction==='reciprocal'&&r.source===b&&r.target===a)))}
function relationsOf(id){return RELATIONSHIPS.filter(r=>withinScope(r.first)&&(r.source===id||r.target===id))}
function eventsOf(id){return EVENTS.filter(e=>e.book<=STATE.scopeBook&&e.participants.includes(id))}
function knowledgeOf(id){return KNOWLEDGE.filter(k=>withinScope(k.book)&&['knows','believes','suspects','disputes','unknown'].some(s=>(k[s]||[]).includes(id)))}
function groupMemberships(id){const c=byId(id);if(!c||!c.cluster)return [];const map={core:'team',certus:'certus',sent:'sent',asgard:'asgard',nether:'nether',order:'order',earth:'team',antagonist:'nether'};return map[c.cluster]?[map[c.cluster]]:[]}
function structuralMetrics(id){const rel=relationsOf(id);const neighbors=new Set(rel.map(r=>r.source===id?r.target:r.source));const weighted=rel.reduce((s,r)=>s+r.intensity,0);const kinds=new Set(rel.map(r=>r.type)).size;const ev=eventsOf(id).length;const kn=knowledgeOf(id).filter(k=>(k.knows||[]).includes(id)).length;return {degree:neighbors.size,weighted,kinds,events:ev,knowledge:kn}}

let dialogReturnFocus=null;let paletteReturnFocus=null;
function openSheet(title,html,mode='half'){dialogReturnFocus=document.activeElement;sheetTitle.textContent=title;sheetBody.innerHTML=html;sheet.className='sheet '+mode+' open';backdrop.classList.add('open');setTimeout(()=>document.getElementById('sheetClose')?.focus(),0)}
function closeSheet(){const wasOpen=sheet.classList.contains('open');sheet.classList.remove('open');backdrop.classList.remove('open');if(wasOpen&&dialogReturnFocus?.isConnected)setTimeout(()=>dialogReturnFocus.focus(),0)}
function inspectRelationship(id){const r=RELATIONSHIPS.find(x=>x.id===id);if(!r)return;const a=byId(r.source),b=byId(r.target);const label=`${a?.name||r.source} ↔ ${b?.name||r.target}`;rememberHistory(label,`#relationship/${r.source}/${r.target}`);const sharedK=KNOWLEDGE.filter(k=>['knows','believes','suspects'].some(s=>(k[s]||[]).includes(r.source))&&['knows','believes','suspects'].some(s=>(k[s]||[]).includes(r.target)));const sharedE=EVENTS.filter(e=>e.participants.includes(r.source)&&e.participants.includes(r.target));openSheet('Relationship',`<div class="kicker">${esc(r.type)} · ${esc(r.status)}</div><h2 style="font:500 30px Georgia,serif;margin:8px 0">${esc(label)}</h2>${pills([r.subtype,r.direction,`strength ${r.intensity}/10`,confidenceLabel(r.confidence),`first ${r.first}`])}<div style="margin:12px 0">${bookmarkButton('relationship',r.id,label,`#relationship/${r.source}/${r.target}`)}</div><div class="divider"></div><p class="prose">${esc(r.explanation)}</p><div class="section-title">Relationship evolution</div><div class="claim"><b>${esc(r.first)}</b> → ${esc(statusLabel(r.status))}<br><span class="tiny">Only source-supported endpoints are shown; intermediate stages are not invented.</span></div><div class="section-title" style="margin-top:16px">Why this connection exists</div><p class="tiny">The relationship is represented because the source places these entities in direct operational, personal, adversarial, or knowledge-bearing contact. Direction and reciprocity are kept explicit.</p><div class="section-title" style="margin-top:16px">Shared events</div>${sharedE.length?sharedE.map(e=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-event="${e.id}">${esc(e.title)}</button>`).join(''):'<p class="tiny">No source-supported shared event recorded in this atlas.</p>'}<div class="section-title" style="margin-top:16px">Shared knowledge</div>${sharedK.length?sharedK.map(k=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-knowledge="${k.id}">${esc(k.title)}</button>`).join(''):'<p class="tiny">No shared knowledge item is encoded.</p>'}`)}
function inspectKnowledge(id){const k=KNOWLEDGE.find(x=>x.id===id);if(!k)return;rememberHistory(k.title,'#knowledge/'+k.id);const row=(label,ids,cls)=>`<div class="section-title" style="margin-top:14px">${label}</div><div class="meta">${ids?.length?ids.map(entityPill).join(''):`<span class="tiny ${cls||''}">UNKNOWN / not established</span>`}</div>`;openSheet('Knowledge',`<div class="kicker">${esc(k.subject)} · ${esc(k.book)}</div><h2 style="font:500 28px/1.1 Georgia,serif">${esc(k.title)}</h2>${pills([confidenceLabel(k.confidence)])}<p class="prose">${esc(k.why)}</p>${row('Knows',k.knows,'knows')}${row('Believes',k.believes,'believes')}${row('Suspects',k.suspects,'suspects')}${row('Disputes',k.disputes,'disputes')}${row('Unknown / not known',k.unknown,'unknown')}<div class="divider"></div><div style="display:flex;gap:8px;flex-wrap:wrap">${bookmarkButton('knowledge',k.id,k.title,'#knowledge/'+k.id)}<button class="solid-btn" data-reveal-knowledge="${k.id}">Reveal this knowledge in Atlas</button></div>`)}
function inspectEvent(id){const e=EVENTS.find(x=>x.id===id);if(!e)return;rememberHistory(e.title,'#events/'+e.id);openSheet('Event impact',`<div class="kicker">${bookLabel(e.book)} · ${esc(e.where)}</div><h2 style="font:500 30px/1.05 Georgia,serif">${esc(e.title)}</h2><p class="prose">${esc(e.summary)}</p><div class="impact"><div class="impact-box"><div class="section-title">Before</div><div class="tiny">${esc(e.before)}</div></div><div class="impact-arrow">→</div><div class="impact-box"><div class="section-title">After</div><div class="tiny">${esc(e.after)}</div></div></div><div class="section-title" style="margin-top:16px">Participants</div><div class="meta">${e.participants.map(entityPill).join('')}</div><div class="section-title" style="margin-top:16px">Source context</div><p class="tiny">${esc(e.evidence)}</p><div class="divider"></div><div style="display:flex;gap:8px;flex-wrap:wrap">${bookmarkButton('event',e.id,e.title,'#events/'+e.id)}<button class="solid-btn" data-event-atlas="${e.id}">Show network at this event</button></div>`)}
function inspectGroup(id){const g=GROUPS.find(x=>x.id===id);if(!g)return;const members=CHARACTERS.filter(c=>groupMemberships(c.id).includes(id));openSheet(g.name,`<div class="kicker">${esc(g.type)}</div><h2 style="font:500 31px Georgia,serif">${esc(g.name)}</h2><p class="prose">${esc(g.desc)}</p><div class="section-title">Encoded members</div><div class="meta">${members.length?members.map(c=>entityPill(c.id)).join(''):'<span class="tiny">Membership is situational or not closed-world.</span>'}</div>`)}
function inspectContradiction(id){const c=CONTRADICTIONS.find(x=>x.id===id);if(!c)return;openSheet('Contradiction',`<div class="kicker">${esc(c.status)} · ${esc(c.book)}</div><h2 style="font:500 28px Georgia,serif">${esc(c.title)}</h2><div class="versus"><div class="claim">${esc(c.a)}</div><div class="vs">VS</div><div class="claim">${esc(c.b)}</div></div><div class="section-title">Atlas treatment</div><p class="prose">${esc(c.resolution)}</p>`)}

function renderAtlas(opts={}){

function graphAdj(){const g=new Map();RELATIONSHIPS.filter(r=>withinScope(r.first)).forEach(r=>{if(!g.has(r.source))g.set(r.source,[]);if(!g.has(r.target))g.set(r.target,[]);g.get(r.source).push({id:r.target,r});g.get(r.target).push({id:r.source,r})});return g}

 if(mode==='event'){const shared=EVENTS.filter(e=>e.book<=STATE.scopeBook&&e.participants.includes(a)&&e.participants.includes(b));if(shared.length)return {ids:[a,b],html:`Shared event: <b>${esc(shared[0].title)}</b>. Both participate in ${shared.length} encoded shared event${shared.length>1?'s':''}.`}}
 if(mode==='knowledge'){const shared=KNOWLEDGE.filter(k=>withinScope(k.book)&&['knows','believes','suspects'].some(s=>(k[s]||[]).includes(a))&&['knows','believes','suspects'].some(s=>(k[s]||[]).includes(b)));if(shared.length)return {ids:[a,b],html:`Shared knowledge: <b>${esc(shared[0].subject)}</b> — ${esc(shared[0].title)}`}}

 let prev=new Map(),dist=new Map([[a,0]]),q=[a];
 while(q.length){let cur;if(mode==='strongest'){q.sort((x,y)=>dist.get(x)-dist.get(y));cur=q.shift()}else cur=q.shift();if(cur===b)break;for(const e of g.get(cur)||[]){const cost=mode==='strongest'?11-e.r.intensity:1;const nd=dist.get(cur)+cost;if(!dist.has(e.id)||nd<dist.get(e.id)){dist.set(e.id,nd);prev.set(e.id,{from:cur,r:e.r});if(!q.includes(e.id))q.push(e.id)}}}

}

function drawMiniNetwork(canvas,id){const ctx=canvas.getContext('2d');const rel=relationsOf(id).slice(0,10);function draw(){const r=canvas.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);const cx=r.width/2,cy=r.height/2;rel.forEach((rr,i)=>{const other=rr.source===id?rr.target:rr.source,a=i/Math.max(1,rel.length)*Math.PI*2-Math.PI/2,x=cx+Math.cos(a)*Math.min(r.width*.34,220),y=cy+Math.sin(a)*Math.min(r.height*.34,95);ctx.strokeStyle=rr.type==='conflict'?'#ff5c73':'#65758d';ctx.globalAlpha=.5;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(x,y);ctx.stroke();ctx.globalAlpha=1;ctx.fillStyle=entityColor(other);ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='10px sans-serif';ctx.textAlign='center';ctx.fillText(entityName(other).split(' ')[0],x,y+31)});ctx.fillStyle=entityColor(id);ctx.beginPath();ctx.arc(cx,cy,26,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font='600 12px sans-serif';ctx.textAlign='center';ctx.fillText(entityName(id).split(' ')[0],cx,cy+4)}draw();const ro=new ResizeObserver(draw);ro.observe(canvas);viewCleanup=()=>ro.disconnect()}

function knowledgeStatus(k,id){if((k.knows||[]).includes(id))return 'KNOWS';if((k.believes||[]).includes(id))return 'BELIEVES';if((k.suspects||[]).includes(id))return 'SUSPECTS';if((k.disputes||[]).includes(id))return 'DISPUTES';if((k.unknown||[]).includes(id))return 'DOES NOT KNOW / UNKNOWN';return 'NOT ESTABLISHED'}
function renderKnowledge(){const keyChars=CHARACTERS.slice(0,10);app.innerHTML=`<section class="view">${pageHead('Knowledge topology','Who knows what?','Knowledge is represented separately from relationships. “Reported,” “suspected,” and “unknown” remain distinct states instead of being flattened into fact.')}<div class="grid"><article class="card span7 pad"><div class="section-title">Propositions</div>${KNOWLEDGE.map(k=>`<article class="card knowledge-card" data-knowledge="${k.id}"><div class="kicker">${esc(k.subject)} · ${esc(k.book)}</div><h3>${esc(k.title)}</h3>${pills([confidenceLabel(k.confidence)])}<div class="status-strip"><span class="status-tag knows">${k.knows.length} know</span><span class="status-tag believes">${k.believes.length} believe</span><span class="status-tag suspects">${k.suspects.length} suspect</span><span class="status-tag disputes">${k.disputes.length} dispute</span></div></article>`).join('')}</article><article class="card span5 pad"><div class="section-title">Knowledge matrix</div><div class="matrix-wrap"><table class="matrix"><thead><tr><th>Claim</th>${keyChars.map(c=>`<th style="color:${c.color}">${esc(c.glyph)}</th>`).join('')}</tr></thead><tbody>${KNOWLEDGE.map(k=>`<tr><td>${esc(k.subject)}</td>${keyChars.map(c=>{const s=knowledgeStatus(k,c.id),sym=s==='KNOWS'?'●':s==='BELIEVES'?'◐':s==='SUSPECTS'?'?':s==='DISPUTES'?'×':'·';return `<td title="${esc(c.name)}: ${esc(s)}" class="${s==='KNOWS'?'knows':s==='BELIEVES'?'believes':s==='SUSPECTS'?'suspects':s==='DISPUTES'?'disputes':'unknown'}">${sym}</td>`}).join('')}</tr>`).join('')}</tbody></table></div><div class="divider"></div><p class="tiny">● knows · ◐ believes · ? suspects · × disputes · · not established / unknown</p></article></div></section>`}

function renderTimeline(){app.innerHTML=`<section class="view"><div class="timeline-shell">${pageHead('Chronology','Time changes the network','The slider uses book-level chronology. Exact dates are not invented where the novels only establish order.')}<article class="card pad"><label class="tiny">Scrub through the series: <b id="tlLabel">${bookLabel(STATE.timelineBook)}</b><input id="tlRange" class="range" type="range" min="1" max="6" value="${STATE.timelineBook}"></label></article><div class="timeline" id="timelineList">${EVENTS.map(e=>`<article class="time-card ${e.book>STATE.timelineBook?'dim':''}" style="--bc:${bookColor(e.book)}" data-event="${e.id}" data-book="${e.book}"><div class="kicker">${bookLabel(e.book)} · ${esc(e.where)}</div><h3>${esc(e.title)}</h3><p class="tiny">${esc(e.summary)}</p></article>`).join('')}</div></div></section>`;const r=document.getElementById('tlRange'),lab=document.getElementById('tlLabel');r.oninput=()=>{STATE.timelineBook=+r.value;saveState();lab.textContent=bookLabel(STATE.timelineBook);document.querySelectorAll('.time-card').forEach(x=>x.classList.toggle('dim',+x.dataset.book>STATE.timelineBook))}}
function renderEvents(){app.innerHTML=`<section class="view">${pageHead('Event engine','Events reshape relationships and knowledge','Each event is encoded as a before → event → after delta. Tap a card for participants, evidence context and an Atlas view at that moment.')}<div class="grid">${EVENTS.map(e=>`<article class="card span6 pad" data-event="${e.id}" style="cursor:pointer"><div class="kicker">${bookLabel(e.book)} · ${esc(e.where)}</div><h3 style="font:500 25px/1.05 Georgia,serif;margin:8px 0">${esc(e.title)}</h3><p class="prose">${esc(e.summary)}</p><div class="meta">${e.participants.slice(0,5).map(entityPill).join('')}${e.participants.length>5?`<span class="pill">+${e.participants.length-5}</span>`:''}</div></article>`).join('')}</div></section>`}
function renderGroups(){app.innerHTML=`<section class="view">${pageHead('Group lens','Organizations, role-classes and cosmic blocs','These are not all the same kind of group. The view keeps institution, alliance, role-class, pantheon and domain labels explicit.')}<div class="grid">${GROUPS.map(g=>`<article class="card span6 pad" data-group="${g.id}" style="cursor:pointer;border-color:color-mix(in srgb,${g.color} 26%,transparent)"><div class="kicker" style="color:${g.color}">${esc(g.type)}</div><h3 style="font:500 28px Georgia,serif;margin:8px 0">${esc(g.name)}</h3><p class="prose">${esc(g.desc)}</p><div class="meta">${CHARACTERS.filter(c=>groupMemberships(c.id).includes(g.id)).slice(0,6).map(c=>entityPill(c.id)).join('')}</div></article>`).join('')}</div></section>`}
function renderContradictions(){app.innerHTML=`<section class="view">${pageHead('Contradiction engine','Disagreement is data','A conflict is not automatically an error. Some are source variants, changed understanding, competing perspectives or unresolved theory.')}<div class="grid">${CONTRADICTIONS.map(c=>`<article class="card span6 pad ${c.status==='DIRECT CONFLICT'?'danger':c.status==='UNRESOLVED'?'warning':''}" data-contradiction="${c.id}" style="cursor:pointer"><div class="kicker">${esc(c.status)} · ${esc(c.book)}</div><h3 style="font:500 25px Georgia,serif;margin:8px 0">${esc(c.title)}</h3><div class="versus"><div class="claim">${esc(c.a)}</div><div class="vs">VS</div><div class="claim">${esc(c.b)}</div></div><p class="tiny">${esc(c.resolution)}</p></article>`).join('')}</div></section>`}

function renderCompare(a='kaz',b='duke'){
 const scopedChars=CHARACTERS.filter(c=>withinScope(c.first));if(!scopedChars.length){routeTo('overview');return}if(a===b)b=scopedChars.find(c=>c.id!==a)?.id||b;const rawA=byId(a),rawB=byId(b);const A=rawA?.role&&withinScope(rawA.first)?rawA:scopedChars[0],B=rawB?.role&&withinScope(rawB.first)&&rawB.id!==A.id?rawB:(scopedChars.find(c=>c.id!==A.id)||A);const ra=new Set(relationsOf(A.id).map(r=>r.source===A.id?r.target:r.source)),rb=new Set(relationsOf(B.id).map(r=>r.source===B.id?r.target:r.source)),shared=[...ra].filter(x=>rb.has(x));const ka=new Set(KNOWLEDGE.filter(k=>(k.knows||[]).includes(A.id)).map(k=>k.id)),kb=new Set(KNOWLEDGE.filter(k=>(k.knows||[]).includes(B.id)).map(k=>k.id)),kshared=[...ka].filter(x=>kb.has(x));const ea=eventsOf(A.id),eb=eventsOf(B.id),eshared=ea.filter(e=>eb.some(x=>x.id===e.id));const ma=structuralMetrics(A.id),mb=structuralMetrics(B.id);const opts=CHARACTERS.filter(c=>withinScope(c.first)).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');app.innerHTML=`<section class="view">${pageHead('Comparison','Knowledge asymmetry + structural overlap','Compare two characters without converting absence into speculation. “Not established” remains different from “does not know.”')}<div class="grid"><article class="card span12 pad"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><select class="select" id="cmpA">${opts}</select><select class="select" id="cmpB">${opts}</select></div><div style="margin-top:10px">${bookmarkButton('compare',A.id+'__'+B.id,A.name+' vs '+B.name,'#compare/'+A.id+'/'+B.id)}</div></article><article class="card span12 compare-hero"><div class="compare-person" style="border-top:3px solid ${A.color}"><div class="sigil" style="--cc:${A.color}">${esc(A.glyph)}</div><h3>${esc(A.name)}</h3><p class="tiny">${esc(A.role)}</p></div><div class="compare-vs">VS</div><div class="compare-person" style="border-top:3px solid ${B.color}"><div class="sigil" style="--cc:${B.color}">${esc(B.glyph)}</div><h3>${esc(B.name)}</h3><p class="tiny">${esc(B.role)}</p></div></article><article class="card span6 pad"><div class="section-title">What both know</div>${kshared.length?kshared.map(id=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-knowledge="${id}">${esc(KNOWLEDGE.find(k=>k.id===id).title)}</button>`).join(''):'<p class="tiny">No shared KNOWN proposition encoded.</p>'}<div class="section-title" style="margin-top:18px">Only ${esc(A.name)} knows</div>${[...ka].filter(x=>!kb.has(x)).map(id=>`<div class="tiny" style="padding:5px 0">${esc(KNOWLEDGE.find(k=>k.id===id).title)}</div>`).join('')||'<p class="tiny">None encoded.</p>'}</article><article class="card span6 pad"><div class="section-title">Only ${esc(B.name)} knows</div>${[...kb].filter(x=>!ka.has(x)).map(id=>`<div class="tiny" style="padding:5px 0">${esc(KNOWLEDGE.find(k=>k.id===id).title)}</div>`).join('')||'<p class="tiny">None encoded.</p>'}<div class="section-title" style="margin-top:18px">What the source does not settle</div><p class="tiny">Absence from a KNOWS list does not mean ignorance. The atlas only labels “does not know” where the source supports that state.</p></article><article class="card span6 pad"><div class="section-title">Shared connections</div><div class="meta">${shared.length?shared.map(entityPill).join(''):'<span class="tiny">No shared direct neighbor.</span>'}</div><div class="section-title" style="margin-top:18px">Shared events</div>${eshared.map(e=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-event="${e.id}">${esc(e.title)}</button>`).join('')||'<p class="tiny">No shared encoded event.</p>'}</article><article class="card span6 pad"><div class="section-title">Structural position</div><div class="asym"><div class="asym-box"><b style="color:${A.color}">${ma.degree}</b><div class="tiny">direct degree</div><b>${ma.events}</b><div class="tiny">events</div><b>${ma.knowledge}</b><div class="tiny">known claims</div></div><div class="asym-box"><b style="color:${B.color}">${mb.degree}</b><div class="tiny">direct degree</div><b>${mb.events}</b><div class="tiny">events</div><b>${mb.knowledge}</b><div class="tiny">known claims</div></div></div></article></div></section>`;const ca=document.getElementById('cmpA'),cb=document.getElementById('cmpB');ca.value=A.id;cb.value=B.id;ca.onchange=()=>routeTo(`compare/${ca.value}/${cb.value}`);cb.onchange=()=>routeTo(`compare/${ca.value}/${cb.value}`)}

function renderStory(){storyIndex=Math.max(0,Math.min(STORY.length-1,storyIndex));const s=STORY[storyIndex];app.innerHTML=`<section class="view no-pad"><div class="story"><div class="story-progress">${STORY.map((_,i)=>`<i class="${i<=storyIndex?'done':''}"></i>`).join('')}</div><div class="story-slide"><div class="story-inner"><div class="kicker">${esc(s.kicker)}</div><h2>${esc(s.title)}</h2><p>${esc(s.text)}</p><div class="story-orbs">${s.ids.map((id,i)=>{const e=byId(id);return `<span class="orb" style="--x:${8+(i*83/Math.max(1,s.ids.length-1))}%;--y:${25+(i%2)*35}%;--c:${e?.color||'#8996aa'}" title="${esc(e?.name||id)}"></span>`}).join('')}</div></div></div><div class="story-controls"><button class="ghost-btn" data-story="prev">Previous</button><button class="ghost-btn" data-story="pause">${storyPaused?'Play':'Pause'}</button><button class="ghost-btn" data-route="atlas">Exit</button><button class="solid-btn" data-story="next">Next</button></div></div></section>`;setupStorySwipe();if(!storyPaused)startStoryTimer()}
function startStoryTimer(){clearInterval(storyTimer);storyTimer=setInterval(()=>{storyIndex=(storyIndex+1)%STORY.length;renderStory()},8000)}
function setupStorySwipe(){const el=app.querySelector('.story'),start={x:0,y:0};el.addEventListener('touchstart',e=>{start.x=e.touches[0].clientX;start.y=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-start.x,dy=e.changedTouches[0].clientY-start.y;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){storyIndex=Math.max(0,Math.min(STORY.length-1,storyIndex+(dx<0?1:-1)));renderStory()}},{passive:true})}

function renderConstellation(){app.innerHTML=`<section class="view no-pad"><div class="atlas"><canvas id="network"></canvas><div class="atlas-watermark">THE WHOLE CONSTELLATION</div><div class="atlas-hud"><button class="ghost-btn" data-route="atlas">Return to Atlas</button><button class="chip" data-graph-action="fit">Fit</button><button class="chip" data-graph-action="labels">Labels ${STATE.labels?'on':'off'}</button></div><div class="canvas-legend"><span>Tap a person or connection to dive back into the archive.</span></div></div></section>`;const api=initGraph(document.getElementById('network'),null,{});graphApi=api;viewCleanup=api.destroy}
function renderAbout(){const isolated=ALL_ENTITIES.filter(e=>!RELATIONSHIPS.some(r=>r.source===e.id||r.target===e.id));const bridge=CHARACTERS.map(c=>({c,m:structuralMetrics(c.id)})).sort((a,b)=>b.m.degree-a.m.degree).slice(0,5);app.innerHTML=`<section class="view">${pageHead('Source & methodology','How to read the archive','This atlas treats the six novels as evidence. It preserves source status, book-level chronology, competing interpretations and explicit uncertainty instead of silently filling gaps.')}<div class="grid"><article class="card span8 pad"><div class="section-title">Six-book corpus</div>${BOOKS.map(b=>`<div class="rel-row" data-book-open="${b.n}"><div class="about-cover asset-slice" style="--cover-pos:${coverPos(b.n)}"></div><div><b>${esc(b.title)}</b><div class="tiny">${b.year} · ${b.chapters} chapters · ${b.pages} file pages in this edition</div></div><span class="tiny">B${b.n}</span></div>`).join('')}</article><article class="card span4 pad"><div class="section-title">Confidence grammar</div><ul class="list"><li class="tiny"><b>CONFIRMED</b> — directly established in the encoded source.</li><li class="tiny"><b>REPORTED</b> — a character reports an experience or claim.</li><li class="tiny"><b>INFERRED</b> — interpretation is useful but not explicit.</li><li class="tiny"><b>DISPUTED</b> — competing claims remain.</li><li class="tiny"><b>UNKNOWN</b> — the source does not settle it.</li></ul></article><article class="card span6 pad"><div class="section-title">Automatic network summary</div><div class="atlas-stats"><div class="stat"><b>${CHARACTERS.length}</b><span class="tiny">major characters</span></div><div class="stat"><b>${RELATIONSHIPS.length}</b><span class="tiny">relationships</span></div><div class="stat"><b>${KNOWLEDGE.length}</b><span class="tiny">knowledge claims</span></div></div><p class="tiny">Most connected in this encoded graph: ${bridge.map(x=>`${x.c.name} (${x.m.degree})`).join(', ')}. ${isolated.length?`Isolated entities: ${isolated.map(x=>x.name).join(', ')}.`:'No encoded entity is fully isolated.'}</p></article><article class="card span6 pad"><div class="section-title">Local controls</div><p class="tiny">All preferences stay in this browser. No telemetry, network analytics or remote requests are used.</p><label class="tiny">Motion<select class="select" id="motionSel"><option value="full">FULL</option><option value="reduced">REDUCED</option><option value="off">OFF</option></select></label><label class="tiny" style="display:block;margin-top:10px">Performance<select class="select" id="perfSel"><option value="full">FULL</option><option value="balanced">BALANCED</option><option value="quiet">QUIET</option></select></label><div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px"><button class="ghost-btn" data-action="toggle-perf">Performance HUD</button><button class="ghost-btn" data-action="clear-history">Clear history</button><button class="ghost-btn" data-action="data-inspector">Data inspector</button><button class="ghost-btn danger" data-action="reset-state">Reset local state</button></div></article><article class="card span12 pad"><div class="section-title">Bookmarks & memory trail</div><div class="grid" style="margin:0"><div class="span6"><div class="kicker">Bookmarks</div>${STATE.bookmarks.length?STATE.bookmarks.map(b=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-bookmark-open="${esc(b.hash)}">★ ${esc(b.label)}</button>`).join(''):'<p class="tiny">No bookmarks yet.</p>'}</div><div class="span6"><div class="kicker">Recent exploration</div>${STATE.history.length?STATE.history.map(h=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-bookmark-open="${esc(h.hash)}">${esc(h.label)}</button>`).join(''):'<p class="tiny">No exploration history yet.</p>'}</div></div></article><article class="card span12 pad"><div class="section-title">Evidence notes</div><div class="grid" style="margin:0">${EVIDENCE.map(e=>`<div class="span6"><div class="claim"><b>${esc(e.source)}</b><br>${esc(e.context)}</div></div>`).join('')}</div></article><article class="card span12 pad"><div class="section-title">Method limits</div><ul class="list"><li class="tiny">The graph is an analytical projection, not a replacement for the novels.</li><li class="tiny">Book-level order is used when exact dates are unclear.</li><li class="tiny">A missing edge means “not encoded from supported evidence,” not “these entities never interact.”</li><li class="tiny">The Dead World timeline model remains unresolved.</li><li class="tiny">Structural metrics are descriptive network measures only.</li><li class="tiny">Visual book art comes from the six supplied cover assets; unrelated Drive images were not imported merely because search terms matched.</li></ul></article></div></section>`;const m=document.getElementById('motionSel'),p=document.getElementById('perfSel');m.value=STATE.motion;p.value=STATE.performance;m.onchange=()=>{STATE.motion=m.value;localStorage.setItem('convergenceAtlasMotionExplicit','1');saveState();setMotionClass();toast('Motion '+STATE.motion)};p.onchange=()=>{STATE.performance=p.value;saveState();toast('Performance '+STATE.performance)}}


function bookCover(n,cls='asset-slice'){return `<span class="${cls}" style="--cover-pos:${coverPos(n)}" aria-hidden="true"></span>`}
function renderBook(n){n=Math.max(1,Math.min(6,+n||1));const b=BOOKS.find(x=>x.n===n);if(n>STATE.scopeBook){app.innerHTML=`<section class="view book-detail" style="--book-color:${b.color}"><div class="book-hero"><div class="book-cover-large asset-slice" role="img" aria-label="${esc(b.title)} supplied cover asset" style="--cover-pos:${coverPos(n)}"></div><div class="book-copy"><div class="eyebrow">Book ${b.n} · outside current spoiler scope</div><h2>${esc(b.title)}</h2><p class="lede">Your atlas is currently limited through Book ${STATE.scopeBook}. This dossier stays sealed until you deliberately extend that boundary.</p><div class="book-actions"><button class="solid-btn" data-scope-book="${n}">Extend scope through Book ${n}</button><button class="ghost-btn" data-route="overview">Return to overview</button></div></div></div></section>`;return}const chars=CHARACTERS.filter(c=>bookNum(c.first)===n);const events=EVENTS.filter(e=>e.book===n);const know=KNOWLEDGE.filter(k=>bookNum(k.book)===n);const rels=RELATIONSHIPS.filter(r=>bookNum(r.first)===n);const locs=LOCATIONS.filter(x=>bookNum(x.book)===n);const objs=OBJECTS.filter(x=>bookNum(x.book)===n);const lead=events[0]?.summary||'This book extends the evidence model without a fabricated synopsis beyond the encoded event and source records.';app.innerHTML=`<section class="view book-detail" style="--book-color:${b.color}"><div class="book-hero"><div class="book-cover-large asset-slice" role="img" style="--cover-pos:${coverPos(n)}" aria-label="${esc(b.title)} supplied cover asset"></div><div class="book-copy"><div class="eyebrow">Book ${b.n} · ${b.year} · asset-driven dossier</div><h2>${esc(b.title)}</h2><p class="lede">${esc(lead)}</p><div class="meta">${pills([BOOK_ASSETS[n].mood,`${b.chapters} chapters`,`${b.pages} file pages`])}</div><div class="book-actions"><button class="solid-btn" data-scope-book="${n}">Set spoiler scope through this book</button><button class="ghost-btn" data-book-atlas="${n}">Open Atlas at B${n}</ d</div>${know.length?know.map(k=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-knowledge="${k.id}">${esc(k.title)}</button>`).join(''):'<p class="tiny">No knowledge records begin here.</p>'}<div class="divider"></div><div class="section-title">Place + artifact expansion</div>${[...locs.map(x=>x.name),...objs.map(x=>x.name)].map(x=>`<div class="tiny" style="padding:5px 0">${esc(x)}</div>`).join('')||'<p class="tiny">No new place/artifact record is encoded for this book.</p>'}</article></div></section>`}

function renderRelationships(){const chars=CHARACTERS.filter(c=>withinScope(c.first)).slice(0,13),rels=RELATIONSHIPS.filter(r=>withinScope(r.first));app.innerHTML=`<section class="view">${pageHead('Relationship lens','Bonds, dependencies, authority, conflict',`Scoped through Book ${STATE.scopeBook}. Tap any populated cell or relationship card to inspect direction, strength, chronology, shared events and shared knowledge.`)}<div class="grid"><article class="card span12 pad"><div class="matrix-wrap"><table class="matrix"><thead><tr><th>Entity</th>${chars.map(c=>`<th title="${esc(c.name)}" style="color:${c.color}">${esc(c.glyph)}</th>`).join('')}</tr></thead><tbody>${chars.map(a=>`<tr><td style="color:${a.color}">${esc(a.name)}</td>${chars.map(b=>{if(a.id===b.id)return '<td class="matrix-empty">—</td>';const r=relationFor(a.id,b.id);return r?`<td><button class="matrix-cell" data-rel="${r.id}" aria-label="${esc(a.name)} and ${esc(b.name)}: ${esc(r.type)}" style="background:${r.type==='conflict'?'rgba(255,92,115,.22)':'color-mix(in srgb,'+entityColor(b)+' 18%,transparent)'}">${r.type==='conflict'?'×':r.direction==='reciprocal'?'↔':'→'}<br><small>${r.intensity}</small></button></td>`:'<td class="matrix-empty">·</td>'}).join('')}</tr>`).join('')}</tbody></table></div><div class="mobile-rel">${rels.filter(r=>chars.some(c=>c.id===r.source)&&chars.some(c=>c.id===r.target)).sort((a,b)=>b.intensity-a.intensity).map(r=>`<button class="ghost-btn" style="width:100%;justify-content:space-between;margin:4px 0" data-rel="${r.id}"><span>${esc(entityName(r.source))} ${r.direction==='reciprocal'?'↔':'→'} ${esc(entityName(r.target))}</span><span class="tiny">${esc(r.type)} ${r.intensity}</span></button>`).join('')}</div></article><article class="card span6 pad"><div class="section-title">Strongest encoded bonds</div>${rels.slice().sort((a,b)=>b.intensity-a.intensity).slice(0,8).map(r=>`<div class="rel-row" data-rel="${r.id}"><div class="avatar" style="--av:${entityColor(r.source)}">${esc(entityName(r.source).slice(0,2))}</div><div><b>${esc(entityName(r.source))} ${r.direction==='reciprocal'?'↔':'→'} ${esc(entityName(r.target))}</b><div class="tiny">${esc(r.type)} · ${esc(r.subtype)}</div></div><span class="tiny">${r.intensity}</span></div>`).join('')}</article><article class="card span6 pad"><div class="section-title">Conflict paths</div>${rels.filter(r=>r.type==='conflict').map(r=>`<div class="rel-row" data-rel="${r.id}"><div class="avatar" style="--av:#ff5c73">×</div><div><b>${esc(entityName(r.source))} ↔ ${esc(entityName(r.target))}</b><div class="tiny">${esc(r.explanation)}</div></div><span class="tiny">${r.status}</span></div>`).join('')||'<p class="tiny">No conflict path is encoded inside this scope.</p>'}</article></div></section>`}

function renderKnowledge(){const scoped=KNOWLEDGE.filter(k=>withinScope(k.book)),keyChars=CHARACTERS.filter(c=>withinScope(c.first)).slice(0,10);app.innerHTML=`<section class="view">${pageHead('Knowledge topology','Who knows what?',`Knowledge is scoped through Book ${STATE.scopeBook}. Reported, suspected, disputed, and unknown remain separate states instead of being flattened into fact.`)}<div class="grid"><article class="card span7 pad"><div class="section-title">Propositions</div>${scoped.map(k=>`<article class="card knowledge-card asset-event" style="--cover-pos:${coverPos(bookNum(k.book))}" data-knowledge="${k.id}"><div class="kicker">${esc(k.subject)} · ${esc(k.book)}</div><h3>${esc(k.title)}</h3>${pills([confidenceLabel(k.confidence)])}<div class="status-strip"><span class="status-tag knows">${k.knows.filter(x=>keyChars.some(c=>c.id===x)).length} know</span><span class="status-tag believes">${k.believes.filter(x=>keyChars.some(c=>c.id===x)).length} believe</span><span class="status-tag suspects">${k.suspects.filter(x=>keyChars.some(c=>c.id===x)).length} suspect</span></div></article>`).join('')||'<p class="tiny">No knowledge record is available inside this scope.</p>'}</article><article class="card span5 pad"><div class="section-title">State matrix</div><div style="overflow:auto"><table class="matrix"><thead><tr><th>Claim</th>${keyChars.map(c=>`<th style="color:${c.color}">${esc(c.glyph)}</th>`).join('')}</tr></thead><tbody>${scoped.map(k=>`<tr><td title="${esc(k.title)}">${esc(k.subject)}</td>${keyChars.map(c=>`<td class="${knowledgeStatus(k,c.id).toLowerCase().replaceAll(' ','-').replaceAll('/','-')}">${esc(knowledgeStatus(k,c.id).replace('NOT ESTABLISHED','—').replace('DOES NOT KNOW / UNKNOWN','?'))}</td>`).join('')}</tr>`).join('')}</tbody></table></div></article></div></section>`}

function renderTimeline(){const scopedEvents=EVENTS.filter(e=>e.book<=STATE.scopeBook);STATE.timelineBook=Math.min(STATE.timelineBook,STATE.scopeBook);app.innerHTML=`<section class="view"><div class="timeline-shell">${pageHead('Chronology','Time changes the network',`The slider is capped at your spoiler boundary: Book ${STATE.scopeBook}. Exact dates are not invented where the novels only establish order.`)}<article class="card pad"><label class="tiny">Scrub through the series: <b id="tlLabel">${bookLabel(STATE.timelineBook)}</b><input id="tlRange" class="range" type="range" min="1" max="${STATE.scopeBook}" value="${STATE.timelineBook}"></label></article><div class="timeline" id="timelineList">${scopedEvents.map(e=>`<article class="time-card asset-event ${e.book>STATE.timelineBook?'dim':''}" style="--bc:${bookColor(e.book)};--cover-pos:${coverPos(e.book)}" data-event="${e.id}" data-book="${e.book}"><div class="kicker">${bookLabel(e.book)} · ${esc(e.where)}</div><h3>${esc(e.title)}</h3><p class="tiny">${esc(e.summary)}</p></article>`).join('')}</div></div></section>`;const r=document.getElementById('tlRange'),lab=document.getElementById('tlLabel');r.oninput=()=>{STATE.timelineBook=+r.value;saveState();lab.textContent=bookLabel(STATE.timelineBook);document.querySelectorAll('.time-card').forEach(x=>x.classList.toggle('dim',+x.dataset.book>STATE.timelineBook))}}

function renderEvents(){const scoped=EVENTS.filter(e=>e.book<=STATE.scopeBook);app.innerHTML=`<section class="view">${pageHead('Event engine','Events reshape relationships and knowledge',`Showing ${scoped.length} encoded events through Book ${STATE.scopeBook}. Each event remains a before → event → after delta.`)}<div class="grid">${scoped.map(e=>`<article class="card span6 pad asset-event" style="--cover-pos:${coverPos(e.book)};cursor:pointer" data-event="${e.id}"><div class="kicker">${bookLabel(e.book)} · ${esc(e.where)}</div><h3 style="font:500 25px/1.05 Georgia,serif;margin:8px 0">${esc(e.title)}</h3><p class="prose">${esc(e.summary)}</p><div class="meta">${e.participants.filter(id=>{const x=byId(id);return !x?.role||withinScope(x.first)}).slice(0,5).map(entityPill).join('')}</div></article>`).join('')}</div></section>`}

function renderContradictions(){const scoped=CONTRADICTIONS.filter(c=>withinScope(c.book));app.innerHTML=`<section class="view">${pageHead('Contradiction engine','Disagreement is data',`Showing ${scoped.length} conflicts through Book ${STATE.scopeBook}. A conflict is not automatically an error.`)}<div class="grid">${scoped.map(c=>`<article class="card span6 pad ${c.status==='DIRECT CONFLICT'?'danger':c.status==='UNRESOLVED'?'warning':''} asset-event" style="--cover-pos:${coverPos(bookNum(c.book))};cursor:pointer" data-contradiction="${c.id}"><div class="kicker">${esc(c.status)} · ${esc(c.book)}</div><h3 style="font:500 25px Georgia,serif;margin:8px 0">${esc(c.title)}</h3><div class="versus"><div class="claim">${esc(c.a)}</div><div class="vs">VS</div><div class="claim">${esc(c.b)}</div></div><p class="tiny">${esc(c.resolution)}</p></article>`).join('')||'<p class="tiny">No contradiction record is available inside this scope.</p>'}</div></section>`}

function inspectRelationship(id){const r=RELATIONSHIPS.find(x=>x.id===id&&withinScope(x.first));if(!r)return;const a=byId(r.source),b=byId(r.target),bn=bookNum(r.first);const label=`${a?.name||r.source} ↔ ${b?.name||r.target}`;rememberHistory(label,`#relationship/${r.source}/${r.target}`);const sharedK=KNOWLEDGE.filter(k=>withinScope(k.book)&&['knows','believes','suspects'].some(s=>(k[s]||[]).includes(r.source))&&['knows','believes','suspects'].some(s=>(k[s]||[]).includes(r.target)));const sharedE=EVENTS.filter(e=>e.book<=STATE.scopeBook&&e.participants.includes(r.source)&&e.participants.includes(r.target));openSheet('Relationship',`<div class="inspect-asset asset-slice" style="--cover-pos:${coverPos(bn)}"></div><div class="kicker">${esc(r.type)} · ${esc(r.status)} · first ${esc(r.first)}</div><h2 style="font:500 30px Georgia,serif;margin:8px 0">${esc(label)}</h2>${pills([r.subtype,r.direction,`strength ${r.intensity}/10`,confidenceLabel(r.confidence)])}<div style="margin:12px 0">${bookmarkButton('relationship',r.id,label,`#relationship/${r.source}/${r.target}`)}</div><div class="divider"></div><p class="prose">${esc(r.explanation)}</p><div class="section-title">Shared events</div>${sharedE.length?sharedE.map(e=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-event="${e.id}">${esc(e.title)}</button>`).join(''):'<p class="tiny">No source-supported shared event inside this scope.</p>'}<div class="section-title" style="margin-top:16px">Shared knowledge</div>${sharedK.length?sharedK.map(k=>`<button class="ghost-btn" style="width:100%;justify-content:flex-start;margin:4px 0" data-knowledge="${k.id}">${esc(k.title)}</button>`).join(''):'<p class="tiny">No shared knowledge item is encoded inside this scope.</p>'}`)}

function inspectKnowledge(id){const k=KNOWLEDGE.find(x=>x.id===id&&withinScope(x.book));if(!k)return;const bn=bookNum(k.book);rememberHistory(k.title,'#knowledge/'+k.id);const row=(label,ids,cls)=>`<div class="section-title" style="margin-top:14px">${label}</div><div class="meta">${(ids||[]).map(entityPill).filter(Boolean).join('')||`<span class="tiny ${cls||''}">UNKNOWN / not established</span>`}</div>`;openSheet('Knowledge',`<div class="inspect-asset asset-slice" style="--cover-pos:${coverPos(bn)}"></div><div class="kicker">${esc(k.subject)} · ${esc(k.book)}</div><h2 style="font:500 28px/1.1 Georgia,serif">${esc(k.title)}</h2>${pills([confidenceLabel(k.confidence)])}<p class="prose">${esc(k.why)}</p>${row('Knows',k.knows,'knows')}${row('Believes',k.believes,'believes')}${row('Suspects',k.suspects,'suspects')}${row('Disputes',k.disputes,'disputes')}${row('Unknown / not known',k.unknown,'unknown')}<div class="divider"></div><div style="display:flex;gap:8px;flex-wrap:wrap">${bookmarkButton('knowledge',k.id,k.title,'#knowledge/'+k.id)}<button class="solid-btn" data-reveal-knowledge="${k.id}">Reveal this knowledge in Atlas</button></div>`)}

function inspectEvent(id){const e=EVENTS.find(x=>x.id===id&&x.book<=STATE.scopeBook);if(!e)return;rememberHistory(e.title,'#events/'+e.id);openSheet('Event impact',`<div class="inspect-asset asset-slice" style="--cover-pos:${coverPos(e.book)}"></div><div class="kicker">${bookLabel(e.book)} · ${esc(e.where)}</div><h2 style="font:500 30px/1.05 Georgia,serif">${esc(e.title)}</h2><p class="prose">${esc(e.summary)}</p><div class="impact"><div class="impact-box"><div class="section-title">Before</div><div class="tiny">${esc(e.before)}</div></div><div class="impact-arrow">→</div><div class="impact-box"><div class="section-title">After</div><div class="tiny">${esc(e.after)}</div></div></div><div class="section-title" style="margin-top:16px">Participants</div><div class="meta">${e.participants.map(entityPill).join('')}</div><div class="section-title" style="margin-top:16px">Source context</div><p class="tiny">${esc(e.evidence)}</p><div class="divider"></div><div style="display:flex;gap:8px;flex-wrap:wrap">${bookmarkButton('event',e.id,e.title,'#events/'+e.id)}<button class="solid-btn" data-event-atlas="${e.id}">Show network at this event</button></div>`)}

function searchItems(q){q=q.trim().toLowerCase();const items=[];BOOKS.filter(b=>b.n<=STATE.scopeBook).forEach(b=>items.push({type:'Book',title:b.title,sub:`Book ${b.n} · ${BOOK_ASSETS[b.n].mood}`,color:b.color,hash:'#book/'+b.n}));CHARACTERS.filter(c=>withinScope(c.first)).forEach(c=>items.push({type:'Character',title:c.name,sub:[...c.aliases,c.role].join(' · '),color:c.color,hash:'#character/'+c.id}));GROUPS.forEach(g=>items.push({type:'Group',title:g.name,sub:g.desc,color:g.color,hash:'#groups',action:()=>inspectGroup(g.id)}));EVENTS.filter(e=>e.book<=STATE.scopeBook).forEach(e=>items.push({type:'Event',title:e.title,sub:e.summary+' '+e.where,color:bookColor(e.book),hash:'#events/'+e.id}));KNOWLEDGE.filter(k=>withinScope(k.book)).forEach(k=>items.push({type:'Knowledge',title:k.subject+': '+k.title,sub:k.book+' '+k.why,color:'#8eb5ff',hash:'#knowledge/'+k.id}));RELATIONSHIPS.filter(r=>withinScope(r.first)).forEach(r=>items.push({type:'Relationship',title:`${entityName(r.source)} ↔ ${entityName(r.target)}`,sub:`${r.type} · ${r.subtype} · ${r.explanation}`,color:edgeSearchColor(r.type),hash:`#relationship/${r.source}/${r.target}`}));LOCATIONS.filter(x=>withinScope(x.book)).forEach(x=>items.push({type:'Location',title:x.name,sub:x.desc,color:'#9ac4ff',hash:'#archive'}));OBJECTS.filter(x=>withinScope(x.book)).forEach(x=>items.push({type:'Object',title:x.name,sub:x.desc,color:'#d5b3ff',hash:'#archive'}));THEMES.forEach(x=>items.push({type:'Theme',title:x.name,sub:x.desc,color:'#78e8c5',hash:'#archive'}));EVIDENCE.filter(x=>withinScope(x.source)).forEach(x=>items.push({type:'Evidence',title:x.source,sub:x.context,color:'#aab6c8',hash:'#about'}));return items.filter(x=>!q||(x.title+' '+x.sub+' '+x.type).toLowerCase().includes(q)).slice(0,30)}
function renderMore(){openSheet('Navigate',`<div style="display:grid;gap:8px">${[['knowledge','Knowledge'],['relationships','Relationships'],['events','Events'],['groups','Groups'],['archive','Field archive'],['contradictions','Contradictions'],['compare','Compare'],['story','Story mode'],['constellation','Whole constellation'],['about','Source & methodology']].map(x=>`<button class="ghost-btn" data-route="${x[0]}" style="justify-content:flex-start">${x[1]}</button>`).join('')}</div>`,'half')}

const _assetRenderAbout=renderAbout;
renderAbout=function(){_assetRenderAbout.apply(this,arguments);injectGeneratedBanner(GDRIVE_VIEW_ART.about,'Cosmic source field')};

function renderRoute(){cleanup();closeSheet();const r=parseRoute();updateNav(r.name==='book'?'overview':r.name==='character'?'characters':r.name==='relationship'?'relationships':r.name);switch(r.name){case'overview':renderOverview();break;case'book':renderBook(r.a);break;case'atlas':renderAtlas();break;case'characters':renderCharacters();break;case'character':renderDossier(r.a);break;case'relationships':renderRelationships();break;case'relationship':renderRelationships();{const rr=RELATIONSHIPS.find(x=>(x.source===r.a&&x.target===r.b)||(x.direction==='reciprocal'&&x.source===r.b&&x.target===r.a));if(rr)setTimeout(()=>inspectRelationship(rr.id),80)}break;case'knowledge':renderKnowledge();if(r.a)setTimeout(()=>inspectKnowledge(r.a),80);break;case'timeline':renderTimeline();break;case'events':renderEvents();if(r.a)setTimeout(()=>inspectEvent(r.a),80);break;case'groups':renderGroups();break;case'archive':renderArchive();break;case'contradictions':renderContradictions();break;case'compare':renderCompare(r.a,r.b);break;case'story':renderStory();break;case'constellation':renderConstellation();break;case'about':renderAbout();break;case'more':renderOverview();setTimeout(renderMore,0);break;default:routeTo('overview')}}

const COMMANDS=[
 ['Open Overview','overview'],['Browse Books','book/1'],['Go to Atlas','atlas'],['Open Field Archive','archive'],['Find Character','characters'],['Compare Characters','compare'],['Open Timeline','timeline'],['Open Knowledge','knowledge'],['Show Contradictions','contradictions'],['Open Story Mode','story'],['Whole Constellation','constellation'],['Source & Methodology','about']
];
function searchItems(q){q=q.trim().toLowerCase();const items=[];CHARACTERS.forEach(c=>items.push({type:'Character',title:c.name,sub:[...c.aliases,c.role].join(' · '),color:c.color,hash:'#character/'+c.id}));GROUPS.forEach(g=>items.push({type:'Group',title:g.name,sub:g.desc,color:g.color,hash:'#groups',action:()=>inspectGroup(g.id)}));EVENTS.forEach(e=>items.push({type:'Event',title:e.title,sub:e.summary+' '+e.where,color:bookColor(e.book),hash:'#events/'+e.id}));KNOWLEDGE.forEach(k=>items.push({type:'Knowledge',title:k.subject+': '+k.title,sub:k.book+' '+k.why,color:'#8eb5ff',hash:'#knowledge/'+k.id}));RELATIONSHIPS.forEach(r=>items.push({type:'Relationship',title:`${entityName(r.source)} ↔ ${entityName(r.target)}`,sub:`${r.type} · ${r.subtype} · ${r.explanation}`,color:edgeSearchColor(r.type),hash:`#relationship/${r.source}/${r.target}`}));LOCATIONS.forEach(x=>items.push({type:'Location',title:x.name,sub:x.desc,color:'#9ac4ff',hash:'#archive'}));OBJECTS.forEach(x=>items.push({type:'Object',title:x.name,sub:x.desc,color:'#d5b3ff',hash:'#archive'}));THEMES.forEach(x=>items.push({type:'Theme',title:x.name,sub:x.desc,color:'#78e8c5',hash:'#archive'}));EVIDENCE.forEach(x=>items.push({type:'Evidence',title:x.source,sub:x.context,color:'#aab6c8',hash:'#about'}));return items.filter(x=>!q||(x.title+' '+x.sub+' '+x.type).toLowerCase().includes(q)).slice(0,30)}
function edgeSearchColor(t){return t==='conflict'?'#ff5c73':t==='love'?'#ff76b8':t==='bond'?'#f4c95d':'#8ea2c0'}
let paletteIndex=0,paletteItems=[];
function renderPalette(q=''){const cmd=q.startsWith('>')||!q?COMMANDS.filter(x=>!q||x[0].toLowerCase().includes(q.replace(/^>/,'').trim().toLowerCase())).map(x=>({type:'Command',title:x[0],sub:'#'+x[1],color:'#ff8b70',hash:'#'+x[1]})):[];paletteItems=[...cmd,...searchItems(q.replace(/^>/,'')).slice(0,35)];paletteIndex=Math.min(paletteIndex,Math.max(0,paletteItems.length-1));paletteResults.innerHTML=paletteItems.map((x,i)=>`<button class="palette-item ${i===paletteIndex?'active':''}" data-pindex="${i}"><span class="picon" style="--pc:${x.color}">${esc(x.type[0])}</span><span><b>${esc(x.title)}</b><small style="display:block;color:#7f8ca0;margin-top:3px">${esc(x.sub||'')}</small></span><span class="tiny">${esc(x.type)}</span></button>`).join('')||'<div class="tiny" style="padding:20px">No source-supported result.</div>'}
function openPalette(initial=''){paletteReturnFocus=document.activeElement;palette.classList.add('open');paletteInput.value=initial;paletteIndex=0;renderPalette(initial);setTimeout(()=>paletteInput.focus(),20)}
function closePalette(){const wasOpen=palette.classList.contains('open');palette.classList.remove('open');paletteInput.blur();if(wasOpen&&paletteReturnFocus?.isConnected)setTimeout(()=>paletteReturnFocus.focus(),0)}
function choosePalette(i){const x=paletteItems[i];if(!x)return;closePalette();if(x.hash)location.hash=x.hash;setTimeout(()=>x.action?.(),100)}

// Global interaction layer.
document.addEventListener('click',ev=>{const route=ev.target.closest('[data-route]');if(route){ev.preventDefault();if(route.dataset.route==='more'){renderMore();return}routeTo(route.dataset.route);return}const earlyPin=ev.target.closest('[data-pin]');if(earlyPin){ev.preventDefault();ev.stopPropagation();const id=earlyPin.dataset.pin;STATE.pins=STATE.pins.includes(id)?STATE.pins.filter(x=>x!==id):[...STATE.pins,id];saveState();renderRoute();toast(STATE.pins.includes(id)?'Pinned':'Unpinned');return}const ch=ev.target.closest('[data-char]');if(ch){routeTo('character/'+ch.dataset.char);return}const rel=ev.target.closest('[data-rel]');if(rel){inspectRelationship(rel.dataset.rel);return}const kn=ev.target.closest('[data-knowledge]');if(kn){inspectKnowledge(kn.dataset.knowledge);return}const event=ev.target.closest('[data-event]');if(event){inspectEvent(event.dataset.event);return}const group=ev.target.closest('[data-group]');if(group){inspectGroup(group.dataset.group);return}const con=ev.target.closest('[data-contradiction]');if(con){inspectContradiction(con.dataset.contradiction);return}const bm=ev.target.closest('[data-bookmark-type]');if(bm){ev.stopPropagation();toggleBookmark(bm.dataset.bookmarkType,bm.dataset.bookmarkId,bm.dataset.bookmarkLabel,bm.dataset.bookmarkHash);const t=bm.dataset.bookmarkType,id=bm.dataset.bookmarkId,label=bm.dataset.bookmarkLabel,hash=bm.dataset.bookmarkHash;bm.textContent=isBookmarked(t,id)?'★ Bookmarked':'☆ Bookmark';return}const bo=ev.target.closest('[data-bookmark-open]');if(bo){routeTo(bo.dataset.bookmarkOpen);return}const pin=ev.target.closest('[data-pin]');if(pin){ev.stopPropagation();const id=pin.dataset.pin;STATE.pins=STATE.pins.includes(id)?STATE.pins.filter(x=>x!==id):[...STATE.pins,id];saveState();renderRoute();toast(STATE.pins.includes(id)?'Pinned':'Unpinned');return}const scope=ev.target.closest('[data-scope-book]');if(scope){closeSheet();setScopeBook(scope.dataset.scopeBook);return}const bookOpen=ev.target.closest('[data-book-open]');if(bookOpen){routeTo('book/'+bookOpen.dataset.bookOpen);return}const bookAtlas=ev.target.closest('[data-book-atlas]');if(bookAtlas){const n=+bookAtlas.dataset.bookAtlas;STATE.timelineBook=Math.min(n,STATE.scopeBook);saveState();routeTo('atlas');setTimeout(()=>graphApi?.setTime(STATE.timelineBook),80);return}const ga=ev.target.closest('[data-graph-action]');if(ga&&graphApi){if(ga.dataset.graphAction==='fit')graphApi.fit();if(ga.dataset.graphAction==='reset')graphApi.reset();if(ga.dataset.graphAction==='labels'){STATE.labels=!STATE.labels;saveState();renderRoute()}return}const gl=ev.target.closest('[data-graph-layer]');if(gl&&graphApi){graphApi.setLayer(gl.dataset.graphLayer);gl.classList.toggle('filter-on');return}const rk=ev.target.closest('[data-reveal-knowledge]');if(rk){closeSheet();routeTo('atlas');setTimeout(()=>graphApi?.revealKnowledge(rk.dataset.revealKnowledge),80);return}const ea=ev.target.closest('[data-event-atlas]');if(ea){closeSheet();const e=EVENTS.find(x=>x.id===ea.dataset.eventAtlas);if(e){STATE.timelineBook=e.book;saveState();routeTo('atlas');setTimeout(()=>{graphApi?.setTime(e.book);graphApi?.focusIds(e.participants)},100)}return}const st=ev.target.closest('[data-story]');if(st){if(st.dataset.story==='prev')storyIndex=Math.max(0,storyIndex-1);if(st.dataset.story==='next')storyIndex=Math.min(STORY.length-1,storyIndex+1);if(st.dataset.story==='pause')storyPaused=!storyPaused;renderStory();return}const act=ev.target.closest('[data-action]');if(act){if(act.dataset.action==='toggle-perf'){STATE.perfHud=!STATE.perfHud;saveState();perfHud.classList.toggle('show',STATE.perfHud);toast('Performance HUD '+(STATE.perfHud?'on':'off'))}if(act.dataset.action==='clear-history'){STATE.history=[];saveState();toast('History cleared')}if(act.dataset.action==='reset-state'){localStorage.removeItem('convergenceAtlasState');STATE={...DEFAULTS};setMotionClass();perfHud.classList.remove('show');toast('Local state reset');setTimeout(renderRoute,150)}if(act.dataset.action==='data-inspector')openDataInspector();return}const pi=ev.target.closest('[data-pindex]');if(pi){choosePalette(+pi.dataset.pindex);return}});
function openDataInspector(){openSheet('Internal data inspector',`<div class="kicker">Local source model</div><p class="tiny">Characters ${CHARACTERS.length} · relationships ${RELATIONSHIPS.length} · events ${EVENTS.length} · knowledge ${KNOWLEDGE.length} · groups ${GROUPS.length} · contradictions ${CONTRADICTIONS.length}</p><details><summary>Characters</summary><pre class="tiny" style="white-space:pre-wrap">${esc(JSON.stringify(CHARACTERS,null,2))}</pre></details><details><summary>Relationships</summary><pre class="tiny" style="white-space:pre-wrap">${esc(JSON.stringify(RELATIONSHIPS,null,2))}</pre></details><details><summary>Events</summary><pre class="tiny" style="white-space:pre-wrap">${esc(JSON.stringify(EVENTS,null,2))}</pre></details>`,'full')}

document.getElementById('sheetClose').onclick=closeSheet;backdrop.onclick=closeSheet;document.getElementById('scopeBtn').onclick=openScopeControl;syncScopeButton();
document.getElementById('searchBtn').onclick=()=>openPalette('');document.getElementById('cmdBtn').onclick=()=>openPalette('>');palette.addEventListener('click',e=>{if(e.target===palette)closePalette()});paletteInput.addEventListener('input',()=>{paletteIndex=0;renderPalette(paletteInput.value)});paletteInput.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){e.preventDefault();paletteIndex=Math.min(paletteItems.length-1,paletteIndex+1);renderPalette(paletteInput.value)}if(e.key==='ArrowUp'){e.preventDefault();paletteIndex=Math.max(0,paletteIndex-1);renderPalette(paletteInput.value)}if(e.key==='Enter'){e.preventDefault();choosePalette(paletteIndex)}if(e.key==='Escape')closePalette()});
document.addEventListener('keydown',e=>{if(e.key==='Tab'){const root=palette.classList.contains('open')?palette:sheet.classList.contains('open')?sheet:null;if(root){const focusable=[...root.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled&&x.offsetParent!==null);if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette('>')}else if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){e.preventDefault();openPalette('')}else if(e.key==='Escape'){closeSheet();closePalette()}});
window.addEventListener('hashchange',renderRoute);
window.addEventListener('orientationchange',()=>setTimeout(()=>graphApi?.fit(),250));

// Bottom-sheet drag / state control on phone.
(()=>{const handle=document.getElementById('sheetHandle');let sy=0,sh=0,drag=false;handle.addEventListener('pointerdown',e=>{if(innerWidth>720)return;drag=true;sy=e.clientY;sh=sheet.getBoundingClientRect().height;handle.setPointerCapture(e.pointerId)});handle.addEventListener('pointermove',e=>{if(!drag)return;const h=Math.max(innerHeight*.22,Math.min(innerHeight*.92,sh+(sy-e.clientY)));sheet.style.height=h+'px'});handle.addEventListener('pointerup',e=>{if(!drag)return;drag=false;const ratio=sheet.getBoundingClientRect().height/innerHeight;sheet.classList.remove('peek','half','full');sheet.classList.add(ratio<.42?'peek':ratio<.75?'half':'full');sheet.style.height='';})})();

// Intro: skip state is remembered separately from simply having seen it.
const intro=document.getElementById('intro'),introSkip=document.getElementById('introSkip');function hideIntro(skipped=false){intro.classList.add('hidden');STATE.introSeen=true;if(skipped)STATE.introSkipped=true;saveState()}
introSkip.onclick=()=>hideIntro(true);if(STATE.introSkipped||STATE.introSeen||matchMedia('(prefers-reduced-motion: reduce)').matches)setTimeout(()=>hideIntro(false),60);else setTimeout(()=>hideIntro(false),5200);
perfHud.classList.toggle('show',STATE.perfHud);

renderRoute();
</script>
</body>
</html>
